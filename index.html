<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>BASKETBALL SCOREBOARD</h1>
    <div id="master-contain">
        <div id="container">
            <div id="master">
                <div class="home">
                    <h1>HOME</h1>
                    <div class="scoreContain">
                        <p id="score-home">0</p>
                    </div>
                    <div class="btns">
                        <button class="btn" id="home1">+1</button>
                        <button class="btn" id="home2">+2</button>
                        <button class="btn" id="home3">+3</button>
                    </div>
                </div>
                <div class="guest">
                    <h1>GUEST</h1>
                    <div class="scoreContain">
                        <p id="score-guest">0</p>
                    </div>
                    <div class="btns">
                        <button class="btn" id="guest1">+1</button>
                        <button class="btn" id="guest2">+2</button>
                        <button class="btn" id="guest3">+3</button>
                    </div>
                </div>
            </div>
            <button class="btn" id="ng">New game</button>
        </div>
    </div>
</body>
<script src="index.js"></script>
</html>
